name: Publish Forge AI Prompt v0.2.19

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.2.19.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Verify release source
        shell: bash
        run: |
          test -f LICENSE
          test -f README.md
          test -f README_RU.md
          test -f CHANGELOG.md
          test -f RELEASE_NOTES.md
          test -f install.py
          test -f scripts/forge_ai_prompt.py
          test -f backend/comfy_worker.py
          test -f backend/fap_worker_client.py
          test -f backend/runtime_install.py
          test -f backend/fap_preset_store.py
          test -f javascript/fap_preset_modal.js
          test -d presets
          test ! -d .runtime
          test ! -d venv
          python3 -m compileall -q backend scripts install.py
          grep -q 'v0.2.19' RELEASE_NOTES.md
      - name: Create v0.2.19 tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view v0.2.19 >/dev/null 2>&1; then
            echo "Release v0.2.19 already exists; no changes made."
          else
            gh release create v0.2.19 --target "$GITHUB_SHA" --title "Forge AI Prompt v0.2.19" --notes-file RELEASE_NOTES.md --latest
          fi
